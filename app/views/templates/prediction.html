{% extends './layout.html' %}

{% block title %}Predicción de arritmias cardíacas | Predecir{% endblock %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/chartist/dist/chartist.min.js"></script>
<script src="{{ url_for('static', filename='js/prediction.js') }}"></script>
{% endblock %}

{% block main %}
<div class="card w-100 shadow p-3 bg-body-tertiary rounded">
    <div class="card-body">
        <div class="upload-area">
            <form id="form_upload_files" action="#" method="post" novalidate="novalidate">
                <h3 class="card-title text-center col-lg-12 mb-2">PREDECIR</h3>

                <!-- Registro (.segx) -->
                <div class="col-lg-12 mb-2">
                    <label for="segxFile" class="col-form-label">Registro segmentado (.segx)</label>
                    <div class="custom-file">
                        <input type="file" class="form-control" name="segxFile" id="segxFile"
                            accept=".segx" placeholder="Selecciona un archivo" required>
                    </div>
                </div>

                <div class="col-lg-12 text-end g-2">
                    <button type="submit" id="btn_upload" class="btn btn-dark"><i
                            class="fa-solid fa-upload"></i>
                        Cargar</button>

                    <button type="button" id="btn_clean" class="btn btn-danger d-none"><i
                            class="fa-solid fa-eraser"></i>
                        Limpiar</button>
                </div>
            </form>
        </div>

        <div class="graph-area">
        </div>
    </div>
</div>
{% endblock %}

{% block template %}
<template id="template_graph_area">
    <form id="form_predict" action="#" method="post" novalidate="novalidate">
        <h3 class="card-title text-center col-lg-12 mt-2 mb-2">RITMO CARDÍACO</h3>
        <div id="ecg-chart" class="col-lg-12 text-center mb-2">
            <div class="ct-chart"></div>
        </div>
        <div class="col-lg-12 mb-2 d-flex align-items-center justify-content-between">
            <div class="progress flex-grow-1" role="progressbar" aria-valuenow="0" aria-valuemin="0"
                aria-valuemax="100">
                <div id="progress_bar" class="progress-bar" style="width: 0%"></div>
            </div>
            <span id="progress_time" class="ms-3">00:00/00:00</span>
        </div>
        <div class="col-lg-12 d-flex flex-wrap justify-content-center justify-content-lg-start mb-2">
            <button type="button" id="btn_backward" class="controls btn btn-dark me-2 mb-2">
                <i class="fa-solid fa-backward"></i>
            </button>
            <button type="button" id="btn_play" class="controls btn btn-dark me-2 mb-2">
                <i class="fa-solid fa-play"></i>
            </button>
            <button type="button" id="btn_forward" class="controls btn btn-dark mb-2">
                <i class="fa-solid fa-forward"></i>
            </button>
            <button type="submit" id="btn_predict" class="btn btn-dark ms-auto">
                <i class="fa-solid fa-brain"></i> Predecir
            </button>
        </div>
        <div class="col-lg-12 text-center g-2">
            <button type="button" id="btn_download_predict" class="download btn btn-primary d-none"><i
                    class="fa-solid fa-download"></i>
                Predicción</button>
        </div>
    </form>
</template>
{% endblock %}
