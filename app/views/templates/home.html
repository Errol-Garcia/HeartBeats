{% extends './layout.html' %}

{% block title %}Predicción de arritmias cardíacas | Proceso Completo{% endblock %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/chartist/dist/chartist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}

{% block main %}
<div class="card w-100 shadow p-3 bg-body-tertiary rounded">
    <div class="card-body">
        <div class="upload-area">
            <form id="form_upload_files" action="#" method="post" novalidate="novalidate">
                <h3 class="card-title text-center col-lg-12 mb-2">PROCESO COMPLETO</h3>

                <!-- Registro (.hea) -->
                <div class="col-lg-12 mb-2">
                    <label for="heaFile" class="col-form-label">Registro (.hea)</label>
                    <div class="custom-file">
                        <input type="file" class="form-control" name="heaFile" id="heaFile"
                            accept=".hea" placeholder="Selecciona un archivo" required>
                    </div>
                </div>

                <!-- Registro (.dat) -->
                <div class="col-lg-12 mb-2">
                    <label for="datFile" class="col-form-label">Registro (.dat)</label>
                    <div class="custom-file">
                        <input type="file" class="form-control" name="datFile" id="datFile"
                            accept=".dat" placeholder="Selecciona un archivo" required>
                    </div>
                </div>

                <!-- Registro (.atr) -->
                <div class="col-lg-12 mb-2">
                    <label for="atrFile" class="col-form-label">Registro (.atr)</label>
                    <div class="custom-file">
                        <input type="file" class="form-control" name="atrFile" id="atrFile"
                            accept=".atr" placeholder="Selecciona un archivo" required>
                    </div>
                </div>

                <div class="col-lg-12 text-end g-2">
                    <button type="submit" id="btn_upload" class="btn btn-dark"><i
                            class="fa-solid fa-upload"></i>
                        Cargar</button>

                    <button type="button" id="btn_clean" class="btn btn-danger d-none"><i
                            class="fa-solid fa-eraser"></i>
                        Limpiar</button>
                </div>
            </form>
        </div>

        <div class="graph-area"></div>
    </div>
</div>
{% endblock %}

{% block template %}
<template id="template_graph_area">
    <form id="form_predict_arrhythmia" action="#" method="post" novalidate="novalidate">
        <h3 id="title_cardiac_rhythm" class="card-title text-center col-lg-12 mt-2 mb-2">RITMO CARDIACO</h3>
        <div id="ecg-chart" class="col-lg-12 text-center mb-2">
            <div class="ct-chart"></div>
        </div>
        <div class="col-lg-12 mb-2 d-flex align-items-center justify-content-between">
            <div class="progress flex-grow-1" role="progressbar" aria-valuenow="0" aria-valuemin="0"
                aria-valuemax="100">
                <div id="progress_bar" class="progress-bar" style="width: 0%"></div>
            </div>
            <span id="progress_time" class="ms-3">00:00/00:00</span>
        </div>
        <div class="col-lg-12 d-flex flex-wrap justify-content-center justify-content-lg-start mb-2">
            <button type="button" id="btn_backward" class="controls btn btn-dark me-2 mb-2">
                <i class="fa-solid fa-backward"></i>
            </button>
            <button type="button" id="btn_play" class="controls btn btn-dark me-2 mb-2">
                <i class="fa-solid fa-play"></i>
            </button>
            <button type="button" id="btn_forward" class="controls btn btn-dark mb-2">
                <i class="fa-solid fa-forward"></i>
            </button>
            <button type="submit" id="btn_predict" class="btn btn-dark ms-auto">
                <i class="fa-solid fa-brain"></i> Predecir
            </button>
        </div>
    </form>
</template>

<template id="template_graph_area2">
    <form id="form_graph" action="#" method="post" novalidate="novalidate">
        <h3 id="title_cardiac_rhythm" class="card-title text-center col-lg-12 mt-2 mb-2">RITMO CARDIACO</h3>
        <div id="total_arrhythmia" class="text-end col-lg-12 mt-2 mb-2">Latidos: <span
                class="badge text-bg-success">0</span> Arrirmias: <span class="badge text-bg-danger">0</span></div>
        <canvas id="ecgChart" class="ct-chart" tabindex="-1"></canvas>
        <div class="col-lg-12 mb-2 d-flex align-items-center justify-content-between">
            <input type="range" id="time_slider" min="0" max="100" step="0.1">
            <span id="progress_time" class="ms-3">00:00/00:00</span>
        </div>
        <div class="col-lg-12 d-flex flex-wrap justify-content-center justify-content-lg-start mb-2">
            <button type="button" id="btn_backward" class="controls btn btn-dark me-2 mb-2">
                <i class="fa-solid fa-backward"></i>
            </button>
            <button type="button" id="btn_play" class="controls btn btn-dark me-2 mb-2">
                <i class="fa-solid fa-play"></i>
            </button>
            <button type="button" id="btn_forward" class="controls btn btn-dark mb-2">
                <i class="fa-solid fa-forward"></i>
            </button>
            <button type="submit" id="btn_predict" class="btn btn-dark ms-auto">
                <i class="fa-solid fa-brain"></i> Predecir
            </button>
        </div>
    </form>
</template>
{% endblock %}
